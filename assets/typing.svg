  </g>
  <g class="v3" style="opacity:0">
    <text x="234.4" y="40.4" textLength="331.2" lengthAdjust="spacing">Currently learning Rust</text>
  </g>
  <g class="m3" style="opacity:0">
    <rect x="234.4" y="8" width="351.2" height="48" fill="#000"/>
    <rect class="cur" x="235.4" y="20.0" width="3" height="24.0" fill="#fff"/>
  </g>
  <g class="v4" style="opacity:0">
