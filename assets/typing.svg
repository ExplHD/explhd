<svg xmlns="http://www.w3.org/2000/svg" width="800" height="64" viewBox="0 0 800 64">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:24px;fill:#fff;letter-spacing:0;white-space:pre}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink .9s infinite}
@keyframes m0{
  0%{transform:translateX(0);opacity:0;animation-timing-function:steps(1,end)}
  0.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(14,end)}
  4.200%{transform:translateX(201.6px);opacity:1;animation-timing-function:linear}
  15.200%{transform:translateX(201.6px);opacity:1;animation-timing-function:steps(14,end)}
  17.300%{transform:translateX(0);opacity:1;animation-timing-function:steps(1,end)}
  17.350%{transform:translateX(0);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
.m0{animation:m0 20.0s infinite}
@keyframes v0{0%{opacity:0}0.000%{opacity:1}17.300%{opacity:1}17.350%{opacity:0}100%{opacity:0}}
.v0{animation:v0 20.0s steps(1,end) infinite}
@keyframes m1{
  0%{transform:translateX(0);opacity:0;animation-timing-function:steps(1,end)}
  20.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(24,end)}
  27.200%{transform:translateX(345.6px);opacity:1;animation-timing-function:linear}
  38.200%{transform:translateX(345.6px);opacity:1;animation-timing-function:steps(24,end)}
  41.800%{transform:translateX(0);opacity:1;animation-timing-function:steps(1,end)}
  41.850%{transform:translateX(0);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
.m1{animation:m1 20.0s infinite}
@keyframes v1{0%{opacity:0}20.000%{opacity:1}41.800%{opacity:1}41.850%{opacity:0}100%{opacity:0}}
.v1{animation:v1 20.0s steps(1,end) infinite}
@keyframes m2{
  0%{transform:translateX(0);opacity:0;animation-timing-function:steps(1,end)}
  40.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(30,end)}
  49.000%{transform:translateX(432.0px);opacity:1;animation-timing-function:linear}
  60.000%{transform:translateX(432.0px);opacity:1;animation-timing-function:steps(30,end)}
  64.500%{transform:translateX(0);opacity:1;animation-timing-function:steps(1,end)}
  64.550%{transform:translateX(0);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
