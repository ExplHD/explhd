.v2{animation:v2 20.0s steps(1,end) infinite}
@keyframes m3{
  0%{transform:translateX(0);opacity:0;animation-timing-function:steps(1,end)}
  60.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(23,end)}
  66.900%{transform:translateX(331.2px);opacity:1;animation-timing-function:linear}
  77.900%{transform:translateX(331.2px);opacity:1;animation-timing-function:steps(23,end)}
  81.350%{transform:translateX(0);opacity:1;animation-timing-function:steps(1,end)}
  81.400%{transform:translateX(0);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
.m3{animation:m3 20.0s infinite}
@keyframes v3{0%{opacity:0}60.000%{opacity:1}81.350%{opacity:1}81.400%{opacity:0}100%{opacity:0}}
.v3{animation:v3 20.0s steps(1,end) infinite}
@keyframes m4{
  0%{transform:translateX(0);opacity:0;animation-timing-function:steps(1,end)}
  80.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(32,end)}
  89.600%{transform:translateX(460.8px);opacity:1;animation-timing-function:linear}
  100.600%{transform:translateX(460.8px);opacity:1;animation-timing-function:steps(32,end)}
  105.400%{transform:translateX(0);opacity:1;animation-timing-function:steps(1,end)}
  100.000%{transform:translateX(0);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
.m4{animation:m4 20.0s infinite}
@keyframes v4{0%{opacity:0}80.000%{opacity:1}105.400%{opacity:1}100.000%{opacity:0}100%{opacity:0}}
.v4{animation:v4 20.0s steps(1,end) infinite}
</style>
<rect x="1" y="1" width="798" height="62" rx="12" fill="#000" stroke="#4d4d4d" stroke-width="2"/>
  <g class="v0" style="opacity:0">
